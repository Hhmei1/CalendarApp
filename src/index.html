<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendrier</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <!-- Bande du haut : sert à déplacer la fenêtre (double-clic pour agrandir) -->
    <div class="barre" data-tauri-drag-region></div>

    <!-- Contrôles de fenêtre verticaux, en miroir du sélecteur de thème -->
    <div class="controles" role="group" aria-label="Fenêtre">
      <button type="button" class="controle" id="fenetre-fermer" aria-label="Fermer" title="Fermer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5 L19 19 M19 5 L5 19" /></svg>
      </button>
      <button type="button" class="controle" id="fenetre-agrandir" aria-label="Agrandir" title="Agrandir">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" /></svg>
      </button>
      <button type="button" class="controle" id="fenetre-reduire" aria-label="Réduire" title="Réduire">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12 L19 12" /></svg>
      </button>
    </div>

    <!-- Sélecteur de thème vertical, hors du cadre -->
    <div class="theme" role="group" aria-label="Thème">
      <button type="button" class="theme-choix" data-theme-choix="dark">
        <span class="carre" aria-hidden="true"></span>DARK
      </button>
      <button type="button" class="theme-choix" data-theme-choix="light">
        <span class="carre" aria-hidden="true"></span>LIGHT
      </button>
    </div>

    <main class="cadre">
      <header class="entete">
        <h1 id="titre-mois"></h1>
        <p id="date-du-jour" class="sous-titre"></p>
      </header>

      <nav class="navigation" aria-label="Navigation du calendrier">
        <button type="button" id="mois-precedent">Précédent</button>
        <button type="button" id="mois-suivant">Suivant</button>
        <button type="button" id="aller-aujourdhui">Aujourd'hui</button>
      </nav>

      <section class="mois" aria-labelledby="titre-mois">
        <div class="jours-semaine" aria-hidden="true">
          <span>lun</span><span>mar</span><span>mer</span><span>jeu</span>
          <span>ven</span><span>sam</span><span>dim</span>
        </div>
        <div id="grille" class="grille"></div>
      </section>

      <aside class="panneau" aria-live="polite">
        <h2 id="titre-jour"></h2>
        <ul id="liste-evenements" class="liste"></ul>
        <p id="vide" class="vide" hidden>Rien de prévu ce jour-là.</p>

        <button type="button" id="ouvrir-ajout" class="ouvrir-ajout">Ajouter</button>

        <form id="formulaire" class="formulaire" hidden>
          <input
            id="champ-titre"
            type="text"
            placeholder="Nouvel événement"
            aria-label="Titre de l'événement"
            autocomplete="off"
            required
          />
          <div class="horaires">
            <label>
              <span>Début</span>
              <input id="champ-debut" type="time" />
            </label>
            <label>
              <span>Fin</span>
              <input id="champ-fin" type="time" />
            </label>
          </div>
          <div class="actions">
            <button type="submit">Enregistrer</button>
            <button type="button" id="annuler">Annuler</button>
          </div>
        </form>
      </aside>
    </main>
  </body>
</html>
