<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>H_Calendar</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- Bibliothèque Supabase, copiée depuis node_modules (voir le guide) -->
    <script src="/lib/supabase.js"></script>
    <script type="module" src="/main.js"></script>
  </head>

  <body>
    <!-- Bande du haut : sert à déplacer la fenêtre (double-clic pour agrandir) -->
    <div class="barre" data-tauri-drag-region></div>

    <!-- Contrôles de fenêtre verticaux, en miroir du sélecteur de thème -->
    <div class="controles" role="group" aria-label="Fenêtre">
      <button type="button" class="controle" id="fenetre-fermer" aria-label="Fermer" title="Fermer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5 L19 19 M19 5 L5 19" /></svg>
      </button>
      <button type="button" class="controle" id="fenetre-agrandir" aria-label="Agrandir" title="Agrandir">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" /></svg>
      </button>
      <button type="button" class="controle" id="fenetre-reduire" aria-label="Réduire" title="Réduire">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12 L19 12" /></svg>
      </button>
    </div>

    <!-- Déconnexion : petite icône discrète en bas à droite, hors du cadre -->
    <button type="button" id="deconnexion" class="deconnexion" aria-label="Se déconnecter" title="Se déconnecter" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4 H5 V20 H10 M14 8 L18 12 L14 16 M18 12 H9" /></svg>
    </button>

    <!-- Sélecteur de thème vertical, hors du cadre -->
    <div class="theme" role="group" aria-label="Thème">
      <button type="button" class="theme-choix" data-theme-choix="dark">
        <span class="carre" aria-hidden="true"></span>DARK
      </button>
      <button type="button" class="theme-choix" data-theme-choix="light">
        <span class="carre" aria-hidden="true"></span>LIGHT
      </button>
    </div>

    <!-- Écran de connexion : affiché une seule fois par appareil -->
    <main id="connexion" class="cadre cadre-connexion" hidden>
      <header class="entete">
        <h1>H_Calendar</h1>
        <p class="sous-titre">Connexion</p>
      </header>

      <form id="form-connexion" class="formulaire form-connexion">
        <div class="champs">
          <input id="champ-email" type="email" placeholder="E-mail" aria-label="E-mail"
                 autocomplete="username" required />
          <input id="champ-mot-de-passe" type="password" placeholder="Mot de passe"
                 aria-label="Mot de passe" autocomplete="current-password" required />
        </div>
        <div class="actions">
          <button type="submit" class="action" aria-label="Se connecter" title="Se connecter">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5 L9.5 18 L20 6" /></svg>
          </button>
        </div>
      </form>
      <p id="erreur-connexion" class="message" hidden></p>
    </main>

    <main id="calendrier" class="cadre" hidden>
      <header class="entete">
        <h1 id="titre-mois"></h1>
        <p id="date-du-jour" class="sous-titre"></p>
      </header>

      <nav class="navigation" aria-label="Navigation du calendrier">
        <button type="button" id="mois-precedent">Précédent</button>
        <button type="button" id="mois-suivant">Suivant</button>
        <button type="button" id="aller-aujourdhui">Aujourd'hui</button>
      </nav>

      <section class="mois" aria-labelledby="titre-mois">
        <div class="jours-semaine" aria-hidden="true">
          <span>lun</span><span>mar</span><span>mer</span><span>jeu</span>
          <span>ven</span><span>sam</span><span>dim</span>
        </div>
        <div id="grille" class="grille"></div>
      </section>

      <aside class="panneau" aria-live="polite">
        <h2 id="titre-jour"></h2>
        <p id="message" class="message" hidden></p>
        <ul id="liste-evenements" class="liste"></ul>
        <p id="vide" class="vide" hidden>Rien de prévu ce jour-là.</p>

        <button type="button" id="ouvrir-ajout" class="ouvrir-ajout">Ajouter</button>

        <form id="formulaire" class="formulaire" hidden>
          <div class="champs">
            <input
              id="champ-titre"
              type="text"
              placeholder="Nouvel événement"
              aria-label="Titre de l'événement"
              autocomplete="off"
              required
            />
            <div class="horaires">
              <label>
                <span>Début</span>
                <input id="champ-debut" type="time" />
              </label>
              <label>
                <span>Fin</span>
                <input id="champ-fin" type="time" />
              </label>
            </div>
          </div>

          <!-- Valider / annuler : deux icônes à droite du bloc -->
          <div class="actions">
            <button type="submit" class="action" aria-label="Enregistrer" title="Enregistrer">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5 L9.5 18 L20 6" /></svg>
            </button>
            <button type="button" class="action" id="annuler" aria-label="Annuler" title="Annuler">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5 L19 19 M19 5 L5 19" /></svg>
            </button>
          </div>
        </form>
      </aside>
    </main>
  </body>
</html>
